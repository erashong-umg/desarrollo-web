[build]
  # Instala también las dependencias del backend, que usa la función de la API.
  # --omit=dev evita instalar nodemon (solo se usa en desarrollo local).
  # Se usa "cd backend" (no --prefix) porque npm 11 bloquea con EALLOWSCRIPTS
  # las instalaciones "project-scoped" cuando --prefix apunta a un proyecto
  # distinto al directorio actual.
  command = "cd backend && npm ci --omit=dev && cd .. && npm run build"
  publish = "dist"
  functions = "backend/netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

# La API debe ir antes del fallback de la SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
